[project]
name = "gesture-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "afraaz", email = "syedafraaz1312@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av>=17.1.0",
    "mediapipe>=1.0.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "scikit-learn>=1.9.0",
    "streamlit>=1.63.0",
    "streamlit-webrtc>=0.77.0",
    "tensorflow>=2.21.0",
]

[project.scripts]
gesture-recognition = "gesture_recognition:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
